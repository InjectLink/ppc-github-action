[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-obsolescence"
version = "0.5.0"
description = "Radar d'obsolescence PPC : croise une nomenclature mécanique, électronique et logicielle avec des sources ouvertes de signaux d'obsolescence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Association PPC (Pérennité Programmée Circulaire)" }]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.0"]

[project.scripts]
radar-obsolescence = "radar_obsolescence.__main__:main"

[tool.setuptools.packages.find]
include = ["radar_obsolescence*"]
