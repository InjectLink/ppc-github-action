name: "Radar d'obsolescence PPC"
description: "Analyse une nomenclature et génère le radar d'obsolescence PPC"
author: "Association PPC (Pérennité Programmée Circulaire)"

branding:
  icon: "activity"
  color: "green"

inputs:
  nomenclature:
    description: "Chemin du classeur XLSX ou de la nomenclature CSV à analyser"
    required: true
  produit:
    description: "Chemin de la fiche produit JSON (inutile si le classeur contient l'onglet Produit)"
    required: false
    default: ""
  carte:
    description: "Chemin du fichier etapes_par_composant.csv"
    required: false
    default: ""
  scenario:
    description: "Scénario de la carte de démontage (par exemple Actuel ou Amélioré)"
    required: false
    default: ""
  sortie:
    description: "Dossier dans lequel écrire les résultats"
    required: false
    default: "resultats"
  ords:
    description: "Chemin du CSV Open Repair Alliance (optionnel)"
    required: false
    default: ""
  onglet:
    description: "Nom de l'onglet de nomenclature à analyser"
    required: false
    default: ""
  hors-ligne:
    description: "N'utiliser que le cache local (true ou false)"
    required: false
    default: "false"
  cache:
    description: "Dossier du cache des sources externes"
    required: false
    default: ".cache_radar"

  # Ces entrées sont optionnelles. Dans un workflow, leur passer des valeurs
  # provenant de `secrets` afin que GitHub les masque dans les journaux.
  mouser-api-key:
    description: "Clé Mouser Search API (à fournir via secrets.MOUSER_API_KEY)"
    required: false
    default: ""
  digikey-client-id:
    description: "Client ID DigiKey (à fournir via secrets.DIGIKEY_CLIENT_ID)"
    required: false
    default: ""
  digikey-client-secret:
    description: "Client Secret DigiKey (à fournir via secrets.DIGIKEY_CLIENT_SECRET)"
    required: false
    default: ""
  digikey-account-id:
    description: "Numéro de compte DigiKey, si requis (via secrets.DIGIKEY_ACCOUNT_ID)"
    required: false
    default: ""
  digikey-site:
    description: "Site DigiKey"
    required: false
    default: "FR"
  digikey-langue:
    description: "Langue DigiKey"
    required: false
    default: "en"
  digikey-devise:
    description: "Devise DigiKey"
    required: false
    default: "EUR"
  nexar-token:
    description: "Jeton Nexar/Octopart (à fournir via secrets.NEXAR_TOKEN)"
    required: false
    default: ""
  nexar-client-id:
    description: "Client ID Nexar/Octopart (à fournir via secrets.NEXAR_CLIENT_ID)"
    required: false
    default: ""
  nexar-client-secret:
    description: "Client Secret Nexar/Octopart (à fournir via secrets.NEXAR_CLIENT_SECRET)"
    required: false
    default: ""

outputs:
  result-directory:
    description: "Dossier contenant visualiseur.html, les rapports et les tableaux"
    value: ${{ steps.radar.outputs.result-directory }}
  summary-file:
    description: "Chemin du résumé JSON"
    value: ${{ steps.radar.outputs.summary-file }}

runs:
  using: "composite"
  steps:
    - name: Installer Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: ${{ github.action_path }}/outil/pyproject.toml

    - name: Installer les dépendances du radar
      shell: bash
      run: python -m pip install "${GITHUB_ACTION_PATH}/outil[xlsx]" truststore

    - name: Exécuter le radar d'obsolescence
      id: radar
      shell: bash
      env:
        RADAR_NOMENCLATURE: ${{ inputs.nomenclature }}
        RADAR_PRODUIT: ${{ inputs.produit }}
        RADAR_CARTE: ${{ inputs.carte }}
        RADAR_SCENARIO: ${{ inputs.scenario }}
        RADAR_SORTIE: ${{ inputs.sortie }}
        RADAR_ORDS: ${{ inputs.ords }}
        RADAR_ONGLET: ${{ inputs.onglet }}
        RADAR_HORS_LIGNE: ${{ inputs.hors-ligne }}
        RADAR_CACHE: ${{ inputs.cache }}
        ACTION_MOUSER_API_KEY: ${{ inputs.mouser-api-key }}
        ACTION_DIGIKEY_CLIENT_ID: ${{ inputs.digikey-client-id }}
        ACTION_DIGIKEY_CLIENT_SECRET: ${{ inputs.digikey-client-secret }}
        ACTION_DIGIKEY_ACCOUNT_ID: ${{ inputs.digikey-account-id }}
        ACTION_DIGIKEY_SITE: ${{ inputs.digikey-site }}
        ACTION_DIGIKEY_LANGUE: ${{ inputs.digikey-langue }}
        ACTION_DIGIKEY_DEVISE: ${{ inputs.digikey-devise }}
        ACTION_NEXAR_TOKEN: ${{ inputs.nexar-token }}
        ACTION_NEXAR_CLIENT_ID: ${{ inputs.nexar-client-id }}
        ACTION_NEXAR_CLIENT_SECRET: ${{ inputs.nexar-client-secret }}
      run: |
        set -euo pipefail

        case "$RADAR_SORTIE" in
          *$'\n'*|*$'\r'*) echo "::error::L'entrée sortie ne doit pas contenir de retour à la ligne."; exit 2 ;;
        esac

        # Une entrée non vide prend le pas sur une variable d'environnement
        # éventuellement définie directement par le workflow appelant.
        [ -z "$ACTION_MOUSER_API_KEY" ] || export MOUSER_API_KEY="$ACTION_MOUSER_API_KEY"
        [ -z "$ACTION_DIGIKEY_CLIENT_ID" ] || export DIGIKEY_CLIENT_ID="$ACTION_DIGIKEY_CLIENT_ID"
        [ -z "$ACTION_DIGIKEY_CLIENT_SECRET" ] || export DIGIKEY_CLIENT_SECRET="$ACTION_DIGIKEY_CLIENT_SECRET"
        [ -z "$ACTION_DIGIKEY_ACCOUNT_ID" ] || export DIGIKEY_ACCOUNT_ID="$ACTION_DIGIKEY_ACCOUNT_ID"
        [ -z "$ACTION_DIGIKEY_SITE" ] || export DIGIKEY_SITE="$ACTION_DIGIKEY_SITE"
        [ -z "$ACTION_DIGIKEY_LANGUE" ] || export DIGIKEY_LANGUE="$ACTION_DIGIKEY_LANGUE"
        [ -z "$ACTION_DIGIKEY_DEVISE" ] || export DIGIKEY_DEVISE="$ACTION_DIGIKEY_DEVISE"
        [ -z "$ACTION_NEXAR_TOKEN" ] || export NEXAR_TOKEN="$ACTION_NEXAR_TOKEN"
        [ -z "$ACTION_NEXAR_CLIENT_ID" ] || export NEXAR_CLIENT_ID="$ACTION_NEXAR_CLIENT_ID"
        [ -z "$ACTION_NEXAR_CLIENT_SECRET" ] || export NEXAR_CLIENT_SECRET="$ACTION_NEXAR_CLIENT_SECRET"

        arguments=("$RADAR_NOMENCLATURE" --sortie "$RADAR_SORTIE" --cache "$RADAR_CACHE")
        [ -z "$RADAR_PRODUIT" ] || arguments+=(--produit "$RADAR_PRODUIT")
        [ -z "$RADAR_CARTE" ] || arguments+=(--carte "$RADAR_CARTE")
        [ -z "$RADAR_SCENARIO" ] || arguments+=(--scenario "$RADAR_SCENARIO")
        [ -z "$RADAR_ORDS" ] || arguments+=(--ords "$RADAR_ORDS")
        [ -z "$RADAR_ONGLET" ] || arguments+=(--onglet "$RADAR_ONGLET")

        case "$RADAR_HORS_LIGNE" in
          true|TRUE|True) arguments+=(--hors-ligne) ;;
          false|FALSE|False) ;;
          *) echo "::error::L'entrée hors-ligne doit valoir true ou false."; exit 2 ;;
        esac

        python "$GITHUB_ACTION_PATH/radar.py" "${arguments[@]}"

        echo "result-directory=$RADAR_SORTIE" >> "$GITHUB_OUTPUT"
        echo "summary-file=$RADAR_SORTIE/resume.json" >> "$GITHUB_OUTPUT"

